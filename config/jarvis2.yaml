# Jarvis-2 Model Configuration (Intermediate Engine)
name: "jarvis2"
version: "2.0.0"
model_type: "transformer"

# Hyperparameters (~400M parameters)
vocab_size: 32768
d_model: 1280
n_layers: 20
n_heads: 16
d_ff: 5120
max_seq_len: 4096
dropout: 0.1
norm_eps: 1e-5

# Training Hyperparameters
learning_rate: 1.5e-4
min_learning_rate: 1.5e-5
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
warmup_steps: 2000
max_steps: 100000
batch_size: 64
