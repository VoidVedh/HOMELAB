# Jarvis-0 Model Configuration (Proof of Concept)
name: "jarvis0"
version: "0.1.0"
model_type: "transformer"

# Hyperparameters
vocab_size: 4096
d_model: 256
n_layers: 6
n_heads: 8
d_ff: 1024
max_seq_len: 512
dropout: 0.1
norm_eps: 1e-5

# Training Hyperparameters
learning_rate: 3e-4
min_learning_rate: 3e-5
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
warmup_steps: 100
max_steps: 1000
batch_size: 16
