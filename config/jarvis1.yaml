# Jarvis-1 Model Configuration (Small Engine)
name: "jarvis1"
version: "1.0.0"
model_type: "transformer"

# Hyperparameters (~85M parameters)
vocab_size: 16384
d_model: 768
n_layers: 12
n_heads: 12
n_kv_heads: 4
d_ff: 3072
max_seq_len: 2048
dropout: 0.1
norm_eps: 1e-5

# Training Hyperparameters
learning_rate: 2e-4
min_learning_rate: 2e-5
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
warmup_steps: 1000
max_steps: 50000
batch_size: 32
